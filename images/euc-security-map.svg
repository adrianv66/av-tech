</style><marker id="map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--edge)"></path></marker><marker id="map-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--accent)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" style="fill:var(--ink)">Twelve layers, each owned by one tool, from sign-in to recovery</text><g><rect x="24" y="56" width="712" height="52" rx="8" fill-opacity="0.12" stroke-width="2" style="fill:var(--accent);stroke:var(--accent)"></rect><circle cx="46" cy="56" r="11" stroke-width="1.5" style="fill:var(--accent);stroke:var(--accent)"></circle><text x="46" y="60" text-anchor="middle" font-size="11.5" font-weight="600" class="badge">1</text><text x="380" y="78" text-anchor="middle" font-weight="600" style="fill:var(--ink)">Identity: Entra ID</text><text x="380" y="96" text-anchor="middle" font-size="11.5" style="fill:var(--quiet)">MFA and Conditional Access on every sign-in</text></g><g fill="none" style="stroke:var(--edge)" stroke-width="1.25"><path d="M255 108V140" marker-end="url(#map-arrow)"></path><path d="M421 108V140" marker-end="url(#map-arrow)"></path><path d="M164 178H180" marker-end="url(#map-arrow)"></path><path d="M330 178H346" marker-end="url(#map-arrow)"></path><path d="M496 178H512" marker-end="url(#map-arrow)"></path></g><g><rect x="24" y="140" width="140" height="76" rx="8" fill="none" style="stroke:var(--edge)" stroke-width="1.25" stroke-dasharray="none"></rect><circle cx="42" cy="140" r="11" stroke-width="1.5" style="fill:var(--accent);stroke:var(--accent)"></circle><text x="42" y="144" text-anchor="middle" font-size="11.5" font-weight="600" class="badge">2</text><text x="94" y="168" text-anchor="middle" font-weight="600" style="fill:var(--ink)">IGEL OS</text><text x="94" y="186" text-anchor="middle"