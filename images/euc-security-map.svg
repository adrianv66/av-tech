<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 552" role="img" aria-label="Twelve layers, each owned by one tool, from sign-in to recovery" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><style>
