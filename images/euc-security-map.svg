pted end to end</text></g><g><rect x="512" y="140" width="224" height="236" rx="10" fill="none" style="stroke:var(--edge)" stroke-width="1.25"></rect><text x="624" y="164" text-anchor="middle" font-weight="600" style="fill:var(--ink)">Session hosts</text></g><g><rect x="528" y="176" width="192" height="56" rx="8" fill="none" style="stroke:var(--edge)" stroke-width="1.25" stroke-dasharray="none"></rect><circle cx="546" cy="176" r="11" stroke-width="1.5" style="fill:var(--accent);stroke:var(--accent)"></circle><text x="546" y="180" text-anchor="middle" font-size="11.5" font-weight="600" class="badge">6</text><text x="624" y="200" text-anchor="middle" font-weight="600" style="fill:var(--ink)">Golden image</text><text x="624" y="218" text-anchor="middle" font-size="11.5" style="fill:var(--quiet)">Hardened, reset on logoff</text></g><g><rect x="528" y="240" width="192" height="56" rx="8" fill="none" style="stroke:var(--edge)" stroke-width="1.25" stroke-dasharray="none"></rect><circle cx="546" cy="240" r="11" stroke-width="1.5" style="fill:var(--accent);stroke:var(--accent)"></circle><text x="546" y="244" text-anchor="middle" font-size="11.5" font-weight="600" class="badge">7</text><text x="624" y="264" text-anchor="middle" font-weight="600" style="fill:var(--ink)">Microsoft Defender</text><text x="624" y="282" text-anchor="middle" font-size="11.5" style="fill:var(--quiet)">EDR tuned for VDI</text></g><g><rect x="528" y="304" width="192" height="56" rx="8" fill="none" style="stroke:var(--edge)" stroke-width="1.25" stroke-dasharray="none"></rect><circle cx="546" cy="304" r="11" stroke-width="1.5" style="fill:var(--accent);stroke:var(--accent)"></circle><text x="546" y="308" text-anchor="middle" font-size="11.5" font-weight="600" class="badge">8</text><text x="624" y="328" text-anchor="middle" font-weight="600" style="fill:var(--ink)">Airlock Digital</text><text x="624" y="346" text-anchor="middle" font-size="11.5" style="fill:var(--quiet)">Allowlist what may run</text></g><g><rect x="24" y="392" width="712" height="136" rx="10" stroke-width="1.25" style="fill:var(--tint);stroke:var(--edge)"></rect><text x="40" y="416" font-weight="600" style="fill:var(--ink)">Operations: across every layer</text></g><g><rect x="40" y="436" width="158" height="76" rx="8" fill="none" style="stroke:var(--edge)" stroke-width="1.25" stroke-dasharray="none"></rect><circle cx="58" cy="436" r="11" stroke-width="1.5" style="fill:var(--accent);stroke:var(--accent)"></circle><text x="58" y="440" text-anchor="middle" font-size="11.5" font-weight="600" class="badge">9</text><text x="119" y="464" text-anchor="middle" font-weight="600" style="fill:var(--ink)">Action1</text><text x="119" y="482" text-anchor="middle" font-size="11.5" style="fill:var(--quiet)">OS and third-party</text><text x="119" y="498" text-anchor="middle" font-size="11.5" style="fill:var(--quiet)">patching</text></g><g><rect x="214" y="436" width="158" height="76" rx="8" fill="none" style="stroke:var(--edge)" stroke-width="1.25" stroke-dasharray="5 4"></rect><circle cx="232" cy="436" r="11" stroke-width="1.5" style="fill:var(--accent);stroke:var(--accent)"></circle><text x="232" y="440" text-anchor="middle" font-size="11.5" font-weight="600" class="badge">10</text><text x="293" y="464" text-anchor="middle" font-weight="600" style="fill:var(--ink)">Privilege (EPM)</text><text x="293" y="482" text-anchor="middle" font-size="11.5" style="fill:var(--quiet)">No standing admin</text><text x="293" y="498" text-anchor="middle" font-size="11.5" style="fill:var(--quiet)">planned</text></g><g><rect x="388" y="436" width="158" height="76" rx="8" fill="none" style="stroke:var(--edge)" stroke-width="1.25" stroke-dasharray="none"></rect><circle cx="406" cy="436" r="11" stroke-width="1.5" style="fill:var(--accent);stroke:var(--accent)"></circle><text x="406" y="440" text-anchor="middle" font-size="11.5" font-weight="600" class="badge">11</text><text x="467" y="464" text-anchor="middle" font-weight="600" style="fill:var(--ink)">Engineer vault</text><text x="467" y="482" text-anchor="middle" font-size="11.5" style="fill:var(--quiet)">Vaulted admin</text><text x="467" y="498" text-anchor="middle" font-size="11.5" style="fill:var(--quiet)">credentials</text></g><g><rect x="562" y="436" width="158" height="76" rx="8" fill="none" style="stroke:var(--edge)" stroke-width="1.25" stroke-dasharray="none"></rect><circle cx="580" cy="436" r="11" stroke-width="1.5" style="fill:var(--accent);stroke:var(--accent)"></circle><text x="580" y="440" text-anchor="middle" font-size="11.5" font-weight="600" class="badge">12</text><text x="641" y="464" text-anchor="middle" font-weight="600" style="fill:var(--ink)">Recovery</text><text x="641" y="482" text-anchor="middle" font-size="11.5" style="fill:var(--quiet)">Tested backups,</text><text x="641" y="498" text-anchor="middle" font-size="11.5" style="fill:var(--quiet)">alerts monitored</text></g></svg>
