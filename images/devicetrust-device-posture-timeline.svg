" y="252" font-size="13" font-weight="400" text-anchor="middle" style="fill:var(--ink)">notify or audit</text></g><rect x="24" y="288" width="468" height="36" rx="8" style="fill:var(--tint);fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><text x="258" y="311" font-size="13" font-weight="400" text-anchor="middle" style="fill:var(--ink)">Citrix Device Posture service</text><rect x="512" y="288" width="224" height="36" rx="8" style="fill:var(--accent);fill-opacity:0.12;stroke:var(--accent);stroke-width:2"></rect><text x="624" y="311" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--ink)">deviceTRUST</text><text x="380" y="352" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">Antivirus status is checked by both: at sign-in and throughout the session</text></svg>