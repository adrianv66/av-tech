<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 452" role="img" aria-label="Entra SSO swaps the FAS servers and CA for a second, silent Entra sign-in" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><style>
svg{--ink:#2b2a28;--quiet:#6f6a62;--edge:#9a9286;--accent:#2f6db5;--tint:#f1ece4;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){svg{--ink:#ece7df;--quiet:#a59f95;--edge:#6f6a62;--accent:#7fb0ea;--tint:#24221f}}
.badge{fill:#fff}
@media (prefers-color-scheme:dark){.badge{fill:#10161e}}
</style><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--edge)"></path></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--accent)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" text-anchor="start" style="fill:var(--ink)">Entra SSO swaps the FAS servers and CA for a second, silent Entra sign-in</text><text x="24" y="68" font-size="13" font-weight="600" text-anchor="start" style="fill:var(--ink)">With FAS</text><path d="M124 112H144" style="fill:none;stroke:var(--edge);stroke-width:1.25" marker-end="url(#arr)"></path><path d="M264 112H284" style="fill:none;stroke:var(--edge);stroke-width:1.25" marker-end="url(#arr)"></path><path d="M404 112H424" style="fill:none;stroke:var(--edge);stroke-width:1.25" marker-end="url(#arr)"></path><path d="M600 112H620" style="fill:none;stroke:var(--edge);stroke-width:1.25" marker-end="url(#arr)"></path><rect x="24" y="84" width="100" height="56" rx="8" style="fill:none;fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><text x="74" y="116" font-size="13" font-weight="400" text-anchor="middle" style="fill:var(--ink)">User</text><rect x="144" y="84" width="120" height="56" rx="8" style="fill:none;fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><text x="204" y="108" font-size="13" font-weight="400" text-anchor="middle" style="fill:var(--ink)">NetScaler</text><text x="204" y="124" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">Entra sign-in</text><rect x="284" y="84" width="120" height="56" rx="8" style="fill:none;fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><text x="344" y="116" font-size="13" font-weight="400" text-anchor="middle" style="fill:var(--ink)">StoreFront</text><rect x="424" y="84" width="176" height="56" rx="8" style="fill:var(--accent);fill-opacity:0.12;stroke:var(--accent);stroke-width:2"></rect><text x="512" y="108" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--ink)">FAS servers and CA</text><text x="512" y="124" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">issue a user certificate</text><rect x="620" y="84" width="116" height="56" rx="8" style="fill:none;fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><text x="678" y="108" font-size="13" font-weight="400" text-anchor="middle" style="fill:var(--ink)">VDA</text><text x="678" y="124" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">smart-card logon</text><text x="380" y="168" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">Extra servers, a CA and certificates to protect, renew and troubleshoot</text><text x="24" y="216" font-size="13" font-weight="600" text-anchor="start" style="fill:var(--ink)">Without FAS: Entra SSO</text><path d="M124 260H144" style="fill:none;stroke:var(--edge);stroke-width:1.25" marker-end="url(#arr)"></path><path d="M264 260H284" style="fill:none;stroke:var(--edge);stroke-width:1.25" marker-end="url(#arr)"></path><path d="M404 260H424" style="fill:none;stroke:var(--edge);stroke-width:1.25" marker-end="url(#arr)"></path><path d="M600 260H620" style="fill:none;stroke:var(--edge);stroke-width:1.25" marker-end="url(#arr)"></path><rect x="24" y="232" width="100" height="56" rx="8" style="fill:none;fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><text x="74" y="264" font-size="13" font-weight="400" text-anchor="middle" style="fill:var(--ink)">User</text><rect x="144" y="232" width="120" height="56" rx="8" style="fill:none;fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><text x="204" y="256" font-size="13" font-weight="400" text-anchor="middle" style="fill:var(--ink)">NetScaler</text><text x="204" y="272" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">Entra sign-in (OIDC)</text><rect x="284" y="232" width="120" height="56" rx="8" style="fill:none;fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><text x="344" y="256" font-size="13" font-weight="400" text-anchor="middle" style="fill:var(--ink)">StoreFront</text><text x="344" y="272" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">gets the token</text><rect x="424" y="232" width="176" height="56" rx="8" style="fill:var(--accent);fill-opacity:0.12;stroke:var(--accent);stroke-width:2"></rect><text x="512" y="256" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--ink)">Silent Entra sign-in</text><text x="512" y="272" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">by Workspace app at launch</text><rect x="620" y="232" width="116" height="56" rx="8" style="fill:none;fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><text x="678" y="256" font-size="13" font-weight="400" text-anchor="middle" style="fill:var(--ink)">VDA</text><text x="678" y="272" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">hybrid joined</text><rect x="424" y="320" width="312" height="56" rx="8" style="fill:var(--tint);fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><text x="580" y="344" font-size="13" font-weight="400" text-anchor="middle" style="fill:var(--ink)">Entra Kerberos object in AD</text><text x="580" y="362" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">lets the VDA accept the Entra logon</text><path d="M678 320V288" style="fill:none;stroke:var(--edge);stroke-width:1.25" marker-end="url(#arr)"></path><text x="380" y="420" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">Conditional Access applies at both sign-ins; no Windows password and no certificate</text></svg>