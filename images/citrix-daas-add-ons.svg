</style><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--edge)"></path></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--accent)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" text-anchor="start" style="fill:var(--ink)">Each Citrix add-on answers one question</text><text x="24" y="88" font-size="13" font-weight="600" text-anchor="start" style="fill:var(--ink)">Access</text><text x="24" y="168" font-size="13" font-weight="600" text-anchor="start" style="fill:var(--ink)">Session</text><text x="24" y="248" font-size="13" font-weight="600" text-anchor="start" style="fill:var(--ink)">Experience</text><text x="24" y="328" font-size="13" font-weight="600" text-anchor="start" style="fill:var(--ink)">Evidence</text><g><rect x="160" y="60" width="272" height="60" rx="8" style="fill:none;fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><text x="296" y="86" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--ink)">Device Posture</text><text x="296" y="104" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">Should this device sign in?</text></g><g><rect x="448" y="60" width="272" height="60" rx="8" style="fill:none;fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><text x="584" y="86" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--ink)">Secure Private Access</text><text x="584" y="104" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">How do users reach web and SaaS apps?</text></g><g><rect x="160" y="140" width="272" height="60" rx="8" style="fill:var(--accent);fill-opacity:0.12;stroke:var(--accent);stroke-width:2"></rect><text x="296" y="166" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--ink)">deviceTRUST</text><text x="296" y="184" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">Is the device still trustworthy?</text></g><g><rect x="448" y="140" width="272" height="60" rx="8" style="fill:none;fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><text x="584" y="166" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--ink)">App Protection</text><text x="584" y="184" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">Can keys or the screen be captured?</text></g><g><rect x="160" y="220" width="272" height="60" rx="8" style="fill:none;fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><text x="296" y="246" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--ink)">Workspace Environment Mgmt</text><text x="296" y="264" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">How do we tune the session?</text></g><g><rect x="448" y="220" width="272" height="60" rx="8" style="fill:var(--accent);fill-opacity:0.12;stroke:var(--accent);stroke-width:2"></rect><text x="584" y="246" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--ink)">uberAgent UXM</text><text x="584" y="264" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">How good is the user&#x27;s experience?</text></g><g><rect x="160" y="300" width="272" height="60" rx="8" style="fill:none;fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><text x="296" y="326" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--ink)">Session Recording</text><text x="296" y="344" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">What exactly happened in a session?</text></g><g><rect x="448" y="300" width="272" height="60" rx="8" style="fill:var(--accent);fill-opacity:0.12;stroke:var(--accent);stroke-width:2"></rect><text x="584" y="326" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--ink)">uberAgent ESA</text><text x="584" y="344" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">Is something malicious happening?</text></g><text x="380" y="388" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">Which add-ons you have depends on your Citrix subscription; check with your Citrix partner</text></svg>