hor="middle" class="badge">8</text></g><text x="644" y="292" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--ink)">vCenter</text><text x="644" y="310" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">Golden image, clones</text><rect x="24" y="400" width="712" height="92" rx="10" style="fill:var(--tint);fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><text x="40" y="424" font-size="13" font-weight="600" text-anchor="start" style="fill:var(--ink)">Operations</text><rect x="40" y="436" width="332" height="44" rx="8" style="fill:none;fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><g><circle cx="58" cy="436" r="11" style="fill:var(--accent)"></circle><text x="58" y="440" font-size="11.5" font-weight="600" text-anchor="middle" class="badge">9</text></g><text x="206" y="463" font-size="13" font-weight="400" text-anchor="middle" style="fill:var(--ink)">Patch UAG, servers, agents and clients</text><rect x="388" y="436" width="332" height="44" rx="8" style="fill:none;fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><g><circle cx="406" cy="436" r="11" style="fill:var(--accent)"></circle><text x="406" y="440" font-size="11.5" font-weight="600" text-anchor="middle" class="badge">10</text></g><text x="554" y="463" font-size="13" font-weight="400" text-anchor="middle" style="fill:var(--ink)">Send events and syslog to monitoring</text></svg>