</style><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--edge)"></path></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--accent)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" text-anchor="start" style="fill:var(--ink)">Ten layers protect a Horizon session, from sign-in to the desktop</text><rect x="24" y="52" width="712" height="48" rx="8" style="fill:var(--accent);fill-opacity:0.12;stroke:var(--accent);stroke-width:2"></rect><g><circle cx="44" cy="52" r="11" style="fill:var(--accent)"></circle><text x="44" y="56" font-size="11.5" font-weight="600" text-anchor="middle" class="badge">1</text></g><text x="380" y="73" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--ink)">Identity: SAML IdP or Entra ID with MFA</text><text x="380" y="90" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">Enforced at the gateway before anything internal is reached</text><rect x="24" y="116" width="168" height="268" rx="10" style="fill:var(--tint);fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><rect x="204" y="116" width="168" height="268" rx="10" style="fill:var(--tint);fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><rect x="384" y="116" width="352" height="268" rx="10" style="fill:var(--tint);fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><text x="108" y="372" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">Internet</text><text x="288" y="372" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">DMZ</text><text x="560" y="372" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">Internal</text><path d="M288 168V140H644V160" style="fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4" marker-end="url(#arrA)"></path><g><circle cx="466" cy="140" r="11" style="fill:var(--accent)"></circle><text x="466" y="144" font-size="11.5" font-weight="600" text-anchor="middle" class="badge">4</text></g><text x="484" y="134" font-size="11.5" font-weight="400" text-anchor="start" style="fill:var(--quiet)">Blast over TLS via Blast Secure Gateway</text><path d="M176 200H220" style="fill:none;stroke:var(--edge);stroke-width:1.25" marker-end="url(#arr)"></path><path d="M356 200H400" style="fill:none;stroke:var(--edge);stroke-width:1.25" marker-end="url(#arr)"></path><path d="M552 200H568" style="fill:none;stroke:var(--edge);stroke-width:1.25" marker-end="url(#arr)"></path><rect x="40" y="168" width="136" height="64" rx="8" style="fill:none;fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><g><circle cx="58" cy="168" r="11" style="fill:var(--accent)"></circle><text x="58" y="172" font-size="11.5" font-weight="600" text-anchor="middle" class="badge">2</text></g><text x="108" y="196" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--ink)">Client</text><text x="108" y="214" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">IGEL or Horizon Client</text><rect x="220" y="168" width="136" height="64" rx="8" style="fill:var(--accent);fill-opacity:0.12;stroke:var(--accent);stroke-width:2"></rect><g><circle cx="238" cy="168" r="11" style="fill:var(--accent)"></circle><text x="238" y="172" font-size="11.5" font-weight="600" text-anchor="middle" class="badge">3</text></g><text x="288" y="196" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--ink)">Access Gateway</text><text x="288" y="214" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--quiet)">Only box in the DMZ</text><rect x="400" y="168" width="152" height="64" rx="8" style="fill:none;fill-opacity:1;stroke:var(--edge);stroke-width:1.25"></rect><g><circle cx="418"