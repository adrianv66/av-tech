<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 512" role="img" aria-label="Ten layers protect a Horizon session, from sign-in to the desktop" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><style>
